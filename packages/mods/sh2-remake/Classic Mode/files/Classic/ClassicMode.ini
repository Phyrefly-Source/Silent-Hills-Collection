; Silent Hill 2 (2024) - Classic Mode
; Lives at <game>\Classic\ClassicMode.ini. The Silent Hills launcher flips [Enhanced] Enabled;
; the in-game toggle key flips the same value. Every other key is read live on change.

[Enhanced]
Enabled=1

[Classic]
; F7 flips Classic Mode on and off while playing.
ToggleKey=F7
; camera = stick/WASD relative to the active shot; tank = turn and push (the 2001 "3D" controls).
Controls=camera
; Keep the previous shot's input frame after a cut until the stick is released.
KeepInputAcrossCuts=1
; 0 = stay in the fixed shot while aiming (auto-aim); 1 = hand the view back to the game's camera while a weapon is raised.
AimReturnsToShoulder=0
; What runs where no shot is authored: follow = classic behind camera; shoulder = the game's own camera.
DefaultWhenNoShot=follow
DefaultFOV=55
ExitMargin=20
; Key that re-centres the follow camera behind James (the 2001 L2 habit).
CameraResetKey=C

[Follow]
Distance=320
Height=160
Lag=4.0

[Editor]
Enabled=1
Key=F1

[Log]
; 0 off, 1 cuts and errors, 2 every shot evaluation
Level=1
