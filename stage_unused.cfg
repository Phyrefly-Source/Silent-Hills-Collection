; Template. Godot rewrites this file when you open Project > Export; keep the
; preset NAMES ("Windows Desktop", "Linux") because release.yml calls them by name.
; Copy next to project.godot after moving the launcher source into launcher/.

[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
export_path="../build/windows/Silent Hills.exe"
encryption_include_filters=""
encryption_exclude_filters=""

[preset.0.options]
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.ico"
application/file_version=""
application/product_version=""
application/company_name="Silent Hills Collection"
application/product_name="Silent Hills"
application/file_description="Silent Hills launcher"
application/copyright=""
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
export_path="../build/linux/silent-hills.x86_64"

[preset.1.options]
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
